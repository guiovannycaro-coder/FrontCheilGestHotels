<form [formGroup]="hotelsForm" (ngSubmit)="onSubmit()">
    <div class="container-fluid">
        <h2 class="text-center mt-3 mb-4"><b>Nuevo Hotel</b></h2>

        <div class="row g-3">
            <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" formControlName="nombre"
                    placeholder="Nombre del hotel">
            </div>

            <div class="col-md-6">
                <label for="descripcion" class="form-label">Descripción</label>
                <input type="text" class="form-control" id="descripcion" formControlName="descripcion"
                    placeholder="Descripción">
            </div>

            <div class="col-md-6">
                <label for="address" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="address" formControlName="address" placeholder="Dirección">
            </div>

            <div class="col-md-6">
                <label for="phone" class="form-label">Teléfono</label>
                <input type="text" class="form-control" id="phone" formControlName="phone" placeholder="Teléfono">
            </div>

            <div class="col-md-6">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" formControlName="email"
                    placeholder="correo@ejemplo.com">
            </div>

            <div class="col-md-6">
                <label for="cityid" class="form-label">Ciudad</label>
                <select class="form-select" id="cityid" formControlName="cityid">
                    <option [ngValue]="null">Seleccione una ciudad</option>
                    <option [ngValue]="27">Bogotá</option>
                    <option [ngValue]="26">Neiva</option>
                    <option [ngValue]="1">Ciudad de prueba (ID 1)</option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="rating" class="form-label">Calificación</label>
                <input type="number" class="form-control" id="rating" formControlName="rating"
                    placeholder="Calificación" min="1" max="5" step="1">
            </div>

            <div class="col-md-6">
                <label for="ratesign" class="form-label">Tarifa / símbolo</label>
                <input type="text" class="form-control" id="ratesign" formControlName="ratesign" placeholder="Ej. 1a">
            </div>

           <!-- <div class="col-12">
                <label for="images" class="form-label">Ruta de la imagen</label>
                <input type="text" class="form-control" id="images" formControlName="images"
                    placeholder="Ej. prueba.com">
            </div>-->

            <!-- Selección y vista previa de la imagen -->
            <div class="col-12">
                <label for="images" class="form-label">Imagen del hotel</label>
            
                <input type="file" class="form-control" id="images" accept="image/png,image/jpeg,image/webp"
                    (change)="onImageSelected($event)">
            
                <small class="form-text text-muted">
                    Formatos permitidos: JPG, PNG y WebP. Tamaño máximo: 400 KB.
                </small>
            
                <!-- Nombre y tamaño del archivo -->
                <div *ngIf="selectedImageName" class="mt-2">
                    <span class="text-success">
                        <i class="fas fa-check-circle mr-1"></i>
                        {{ selectedImageName }}
                    </span>
                    <button type="button" class="btn btn-sm btn-outline-danger ml-2" (click)="removeImage()">
                        Quitar imagen
                    </button>
                </div>
            
                <!-- Vista previa -->
                <div *ngIf="imagePreview" class="mt-3">
                    <p class="mb-2"><strong>Vista previa</strong></p>
                    <img [src]="imagePreview" alt="Vista previa del hotel" style="max-width: 100%; width: 320px; max-height: 220px;
                               object-fit: cover; border-radius: 8px;
                               border: 1px solid #ddd;">
                </div>
            
                <!-- Error de validación -->
                <div *ngIf="imageError" class="text-danger mt-2">
                    {{ imageError }}
                </div>
            </div>

        <div class="col-12 d-flex justify-content-center align-items-center gap-5 mt-5">
            <button type="button" class="btn btn-primary" mat-dialog-close>
                Cancelar
            </button>
        
            <button type="submit" class="btn btn-success" style="margin: 3%;" [disabled]="loading">
                {{ loading ? 'Guardando...' : 'Guardar' }}
            </button>
        </div>
        </div>
    </div>
</form>
