<form [formGroup]="usersForm" (ngSubmit)="onSubmit()">
    <div class="container-fluid">
        <h2 class="text-center mt-3 mb-4">
            <b>Registrarse</b>
        </h2>

        <div class="row g-3">

            <!-- Nombre -->
            <div class="col-md-6">
                <label for="usuNames" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="usuNames" formControlName="usuNames"
                    placeholder="Nombre completo">
            </div>

            <!-- Dirección -->
            <div class="col-md-6">
                <label for="usuAddress" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="usuAddress" formControlName="usuAddress"
                    placeholder="Dirección del usuario">
            </div>

            <!-- Teléfono -->
            <div class="col-md-6">
                <label for="usuPhone" class="form-label">Teléfono</label>
                <input type="tel" class="form-control" id="usuPhone" formControlName="usuPhone" placeholder="Teléfono">
            </div>

            <!-- Correo electrónico -->
            <div class="col-md-6">
                <label for="usuEmail" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="usuEmail" formControlName="usuEmail"
                    placeholder="Correo electrónico">
            </div>

            <!-- Tipo de documento -->
            <div class="col-md-6">
                <label for="usuTdocId" class="form-label">Tipo de documento</label>

                <select class="form-select" id="usuTdocId" formControlName="usuTdocId"
                    style="width: 100%; height: 36px;">
                    <option [ngValue]="null">
                     Seleccione un tipo de documento
                    </option>


                     <option *ngFor="let item of listdoctype"
                        [ngValue]="item.tipId">
                        {{ item.tipDescription }}
                     </option>
                </select>
            </div>

            <!-- Número de documento -->
            <div class="col-md-6">
                <label for="usuDocumentId" class="form-label">Número de documento</label>
                <input type="text" class="form-control" id="usuDocumentId" formControlName="usuDocumentId"
                    placeholder="Número de documento">
            </div>

            <!-- Contraseña -->
            <div class="col-md-6">
                <label for="usuPassword" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="usuPassword" formControlName="usuPassword"
                    placeholder="Contraseña">
            </div>

            <!-- Estado -->
            <div class="col-md-6">
                <label for="usuIsActive" class="form-label">Estado</label>
                <select class="form-select" id="usuIsActive" formControlName="usuIsActive"
                    style="width: 100%; height: 35px;">
                    <option [ngValue]="true">Activo</option>
                    <option [ngValue]="false">Inactivo</option>
                </select>
            </div>

            <!-- Rol fijo: Cliente (ID = 3) -->
            <input type="hidden" formControlName="usuRolId" value="3">

            <!-- Botones -->
            <div class="col-12 d-flex justify-content-center align-items-center gap-4 mt-5">
            <button type="button" class="btn btn-primary" (click)="cancelar()" style="margin: 0% 4% 2% 0%">
                Cancelar
            </button>

                <button type="submit" class="btn btn-success" [disabled]="loading || usersForm.invalid"
                    style="margin: 0% 4% 2% 0%">
                    {{ loading ? 'Registrando...' : 'Registrarse' }}
                </button>
            </div>

        </div>
    </div>
</form>
